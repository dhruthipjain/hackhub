<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Hackathon | HackHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<nav>

    <h2>🚀 HackHub Admin</h2>

    <div>

        <a href="/admin">
            Dashboard
        </a>

        <a href="/">
            Website
        </a>

    </div>

</nav>



<section class="form-container">


    <div class="form-header">

        <h1>
            Add New Hackathon
        </h1>

        <p>
            Add a new hackathon to HackHub.
        </p>

    </div>



    <form
        method="POST"
        class="hackathon-form"
    >


        <div class="form-group">

            <label>
                Hackathon Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Example: AI Innovation Hackathon"
                required
            >

        </div>



        <div class="form-group">

            <label>
                Organizer
            </label>

            <input
                type="text"
                name="organizer"
                placeholder="Example: Tech Innovation Labs"
                required
            >

        </div>



        <div class="form-group">

            <label>
                Description
            </label>

            <textarea
                name="description"
                rows="4"
                placeholder="Describe the hackathon..."
                required
            ></textarea>

        </div>



        <div class="form-row">


            <div class="form-group">

                <label>
                    Registration Deadline
                </label>

                <input
                    type="text"
                    name="registration_deadline"
                    placeholder="Example: 15 October 2026"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Event Date
                </label>

                <input
                    type="text"
                    name="event_date"
                    placeholder="Example: 20-22 October 2026"
                    required
                >

            </div>


        </div>



        <div class="form-row">


            <div class="form-group">

                <label>
                    Prize Pool
                </label>

                <input
                    type="text"
                    name="prize_pool"
                    placeholder="Example: ₹5,00,000"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Team Size
                </label>

                <input
                    type="text"
                    name="team_size"
                    placeholder="Example: 2-4 members"
                    required
                >

            </div>


        </div>



        <div class="form-row">


            <div class="form-group">

                <label>
                    Mode
                </label>

                <select name="mode" required>

                    <option value="Online">
                        Online
                    </option>

                    <option value="Offline">
                        Offline
                    </option>

                    <option value="Hybrid">
                        Hybrid
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Location
                </label>

                <input
                    type="text"
                    name="location"
                    placeholder="Example: Bangalore"
                    required
                >

            </div>


        </div>



        <div class="form-group">

            <label>
                Eligibility
            </label>

            <textarea
                name="eligibility"
                rows="3"
                placeholder="Who can participate?"
                required
            ></textarea>

        </div>



        <div class="form-group">

            <label>
                Technologies
            </label>

            <input
                type="text"
                name="technologies"
                placeholder="Example: Python, AI, Machine Learning"
                required
            >

        </div>



        <div class="form-group">

            <label>
                Registration URL
            </label>

            <input
                type="url"
                name="registration_url"
                placeholder="https://example.com/register"
                required
            >

        </div>



        <div class="form-group">

            <label>
                Source URL
            </label>

            <input
                type="url"
                name="source_url"
                placeholder="https://example.com/hackathon"
                required
            >

        </div>



        <button
            type="submit"
            class="submit-btn"
        >

            🚀 Add Hackathon

        </button>


    </form>


</section>


</body>

</html>
